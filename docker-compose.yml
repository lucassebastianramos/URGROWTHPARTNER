services:
  # ============================================================================
  # 1. PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: urgrowup-doorbell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doorbell_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doorbell_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-doorbell_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doorbell_user} -d ${POSTGRES_DB:-doorbell_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - doorbell_net

  # ============================================================================
  # 2. UrGrowUp Application (Express Backend + WebRTC Signaling + Static SPA)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urgrowup-doorbell-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://urgrowup.com}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-doorbell_user}:${POSTGRES_PASSWORD:-doorbell_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-doorbell_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_urgrowup_2026_change_in_production}
      TOKEN_EXPIRES_IN_SECONDS: ${TOKEN_EXPIRES_IN_SECONDS:-600}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      CALL_TIMEOUT_SECONDS: ${CALL_TIMEOUT_SECONDS:-45}
      RATE_LIMIT_MAX_CALLS: ${RATE_LIMIT_MAX_CALLS:-2}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - doorbell_net

  # ============================================================================
  # 3. Cloudflare Tunnel (Egress to urgrowup.com without opening firewall ports)
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: urgrowup-doorbell-tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - doorbell_net

volumes:
  postgres_data:
    name: urgrowup_doorbell_postgres_data

networks:
  doorbell_net:
    name: urgrowup_doorbell_network
    driver: bridge
